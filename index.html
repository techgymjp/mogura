<!-- 右上のボタン（BGM・言語・一時停止） -->
<div id="controls">
  <button class="chip" id="pauseBtn" data-i18n="btn.pause" hidden>⏸ 一時停止</button>
  <button class="chip" id="bgmBtn" aria-pressed="true"></button>
  <button class="chip" id="langBtn" data-i18n="lang.btn">English</button>
</div>

<!-- 読み込み中 -->
<section id="loadingScreen" class="screen">
  <div class="titleBox">
    <h1 data-i18n-html="titleHtml">本能寺の変<br>モグラ叩き</h1>
    <p class="loadingText" data-i18n="loading">読み込み中…</p>
    <div id="loadBar"><div></div></div>
  </div>
</section>

<!-- タイトル画面 -->
<section id="titleScreen" class="screen" hidden>
  <div class="titleBox">
    <h1 data-i18n-html="titleHtml">本能寺の変<br>モグラ叩き</h1>
    <p class="tagline" data-i18n-html="tagline"></p>
    <p class="bestLine"><span data-i18n="best">ベスト戦功</span> <b id="bestScore">0</b></p>
    <div class="menu">
      <button class="big" id="playBtn" data-i18n="btn.play">出陣</button>
      <button class="big sub" id="howtoBtn" data-i18n="btn.howto">あそびかた</button>
    </div>
  </div>
  <footer id="legal">
    <span id="buildInfo"></span>
    <a href="https://techgym.jp/privacy-policy/" data-i18n-href="url.privacy" data-i18n="legal.privacy" target="_blank" rel="noopener">プライバシーポリシー</a>
    <a href="#" id="adPrivacy" data-i18n="legal.adPrivacy" hidden>広告の設定</a>
  </footer>
</section>

<!-- あそびかた -->
<section id="howtoScreen" class="screen" hidden>
  <div class="howtoBox">
    <h2 data-i18n="howto.title">あそびかた</h2>
    <ul class="rules" data-i18n-html="howto.rules"></ul>
    <div id="cast"></div>
    <p class="rewindNote" id="rewindNote" data-i18n="howto.rewind" hidden></p>
    <div class="menu">
      <button class="big" id="howtoPlay" data-i18n="btn.play">出陣</button>
      <button class="big sub" id="howtoBack" data-i18n="btn.title">タイトルへ</button>
    </div>
  </div>
</section>

<!-- プレイ画面 -->
<section id="gameScreen" class="screen" hidden>
  <div id="hud">
    <div class="hud-box"><div class="label" data-i18n="hud.score">戦功</div><div class="value" id="score">0</div></div>
    <div class="hud-box"><div class="label" data-i18n="hud.time">残り時間</div><div class="value" id="time">30</div></div>
    <div class="hud-box"><div class="label" data-i18n="hud.combo">連撃</div><div class="value" id="combo">0</div></div>
  </div>
  <div id="fireBar" data-i18n-title="hud.fire"><div></div></div>
  <div id="temple">
    <div id="game"></div>
  </div>
</section>

<!-- 一時停止 -->
<div id="pauseMenu" class="overlay" hidden>
  <div class="panel">
    <h2 data-i18n="pause.title">一時停止</h2>
    <button class="big" id="pauseResume" data-i18n="btn.resume">再開</button>
    <button class="big sub" id="pauseTitle" data-i18n="btn.title">タイトルへ</button>
  </div>
</div>

<!-- 信長を叩いたとき：広告を見て時を戻す（アプリのみ） -->
<div id="redo" class="overlay" hidden>
  <div class="panel">
    <h2 data-i18n="redo.title">御屋形様を討ってしまった…</h2>
    <p id="redoNote" data-i18n="redo.note"></p>
    <button class="big" id="redoWatch" data-i18n="redo.watch">▶ 広告を見て時を戻す</button>
    <button class="big sub" id="redoNext"></button>
  </div>
</div>

<!-- 結果 -->
<div id="result" class="overlay" hidden>
  <div class="scroll">
    <h2 id="rankTitle"></h2>
    <div data-i18n="result.score">戦功</div>
    <div class="final" id="finalScore">0</div>
    <div class="bestInfo" id="bestInfo"></div>
    <p class="quote" id="rankQuote"></p>
    <p class="stats" id="stats"></p>
    <p class="stats" id="redoInfo" hidden></p>
    <button class="big share" id="shareBtn" data-i18n="btn.share">📤 結果をシェア</button>
    <div class="toast" id="shareToast" hidden></div>
    <button class="big" id="retryBtn" data-i18n="btn.retry">もう一度、本能寺へ</button>
    <button class="big sub" id="titleBtn" data-i18n="btn.title">タイトルへ</button>
  </div>
</div>

<script src="build-info.js"></script>
<script src="i18n.js"></script>
<script src="sound.js"></script>
<script src="ads.js"></script>
<script src="characters.js"></script>
<script src="scene.js"></script>
