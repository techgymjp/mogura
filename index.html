<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本能寺の変モグラ叩き</title>
  <style>
    :root {
      --night: #120b0b;
      --wood: #5a3420;
      --wood-dark: #331c10;
      --gold: #e8c26a;
      --paper: #f3e6c8;
      --fire: #ff6a1a;
      --blood: #b3261e;
      --kikyo: #6f7fd8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      text-align: center;
      color: var(--paper);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
      background:
        radial-gradient(ellipse at 50% 120%, rgba(255, 90, 20, var(--fire-level, 0.15)), transparent 65%),
        linear-gradient(#1b0f12, var(--night));
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #app { position: relative; z-index: 1; }

    header { padding: 52px 16px 0; }

    /* 結果画面の上でも押せるよう最前面に置く */
    #controls {
      position: absolute;
      top: 10px;
      right: 16px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }

    button.chip {
      margin: 0;
      padding: 6px 12px;
      font-size: 13px;
      letter-spacing: 0;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid var(--gold);
      color: var(--paper);
    }

    button.chip[aria-pressed="false"] { opacity: 0.6; }

    /* ---- 背景：燃える本能寺 ---- */
    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #scene svg { width: 100%; height: 100%; display: block; }

    #scene .haze { opacity: calc(var(--fire-level, 0.15) * 1.1); transition: opacity 1s; }
    #scene .moon-red { opacity: calc(var(--fire-level, 0.15) * 0.7); transition: opacity 1s; }

    #scene .flames {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transform: scaleY(calc(0.3 + var(--fire-level, 0.15) * 0.95));
      opacity: calc(0.35 + var(--fire-level, 0.15));
      transition: transform 1s, opacity 1s;
    }

    #scene .flame {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: flicker 0.5s ease-in-out infinite alternate;
    }

    #scene .win {
      opacity: calc(0.15 + var(--fire-level, 0.15));
      animation: winflicker 0.3s steps(2) infinite alternate;
    }

    #scene .smoke {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      opacity: calc(var(--fire-level, 0.15) * 0.9);
      animation: smoke 6s ease-in-out infinite alternate;
    }

    #scene .banner {
      transform-box: fill-box;
      transform-origin: 0% 0%;
      animation: banner 2.4s ease-in-out infinite alternate;
    }

    @keyframes flicker    { from { transform: scale(1, 1) skewX(-4deg); } to { transform: scale(0.9, 1.15) skewX(5deg); } }
    @keyframes winflicker { from { filter: brightness(1); } to { filter: brightness(1.35); } }
    @keyframes smoke      { from { transform: translate(0, 0) scale(1); } to { transform: translate(-30px, -20px) scale(1.15); } }
    @keyframes banner     { from { transform: skewY(-3deg); } to { transform: skewY(3deg); } }

    #embers {
      position: absolute;
      inset: 0;
      opacity: calc(var(--fire-level, 0.15) * 1.3);
      transition: opacity 1s;
    }

    #embers span {
      position: absolute;
      bottom: -10px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffc163;
      box-shadow: 0 0 6px 2px rgba(255, 110, 20, 0.8);
      opacity: 0;
      animation: rise linear infinite;
    }

    @keyframes rise {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 1; }
      100% { transform: translate(var(--dx, 20px), -100vh); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #scene *, #embers span { animation: none !important; }
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 7vw, 44px);
      letter-spacing: 0.12em;
      color: var(--gold);
      text-shadow: 0 0 12px rgba(255, 106, 26, 0.7), 2px 2px 0 #000;
    }

    .subtitle {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: 0.85;
    }

    #hud {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 16px auto 0;
      max-width: 480px;
      padding: 0 16px;
    }

    .hud-box {
      flex: 1;
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid var(--gold);
      border-radius: 6px;
      padding: 6px 4px;
    }

    .hud-box .label { font-size: 12px; opacity: 0.8; }
    .hud-box .value { font-size: 24px; font-weight: bold; color: var(--gold); }

    #fireBar {
      max-width: 480px;
      height: 10px;
      margin: 10px auto 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
    }

    #fireBar div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffcf3a, var(--fire), var(--blood));
      transition: width 0.25s linear;
    }

    /* 本能寺の床 */
    #temple {
      position: relative;
      max-width: 480px;
      margin: 18px auto 0;
      padding: 18px;
      background:
        repeating-linear-gradient(90deg, rgba(90, 52, 32, 0.84) 0 38px, rgba(51, 28, 16, 0.84) 38px 40px);
      border: 6px solid #2a160c;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(255, 106, 26, var(--fire-level, 0.15));
    }

    #game {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .hole {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      background: radial-gradient(ellipse at 50% 70%, #000 45%, #1d0e07 70%, #3b2214 100%);
      box-shadow: inset 0 8px 14px rgba(0, 0, 0, 0.8);
      touch-action: manipulation;
    }

    .char {
      position: absolute;
      left: 8%;
      width: 84%;
      height: 92%;
      bottom: 0;
      transform: translateY(105%);
      transition: transform 0.12s ease-out;
      pointer-events: none;
    }

    .char.up { transform: translateY(6%); }
    .char.hit { transform: translateY(105%) rotate(25deg); transition: transform 0.25s ease-in; }

    .char svg { width: 100%; height: 100%; display: block; }

    .pop {
      position: absolute;
      left: 50%;
      top: 30%;
      transform: translate(-50%, 0);
      font-size: 20px;
      font-weight: bold;
      pointer-events: none;
      animation: pop 0.7s ease-out forwards;
      text-shadow: 1px 1px 0 #000, 0 0 6px #000;
      white-space: nowrap;
      z-index: 2;
    }

    .pop.plus { color: var(--gold); }
    .pop.minus { color: #ff8a80; }


    /* ---- キャラクターごとの動き（出ている間だけ再生） ---- */
    .char svg, .char svg * { transform-box: fill-box; }
    .char svg { transform-origin: 50% 100%; }
    .char .p-eye { transform-origin: center; animation: blink 2.6s infinite; }

    .char.up.a-mitsuhide svg { animation: rage 0.35s ease-in-out infinite; }
    .char.up.a-hideyoshi svg { animation: hop 0.45s ease-in-out infinite; }
    .char.up.a-ieyasu svg    { animation: sway 1.6s ease-in-out infinite; }
    .char.up.a-yoshiaki svg  { animation: peek 1.1s ease-in-out infinite; }
    .char.up.a-kuge svg      { animation: hohoho 0.9s ease-in-out infinite; }
    .char.up.a-missionary svg{ animation: pray 1.2s ease-in-out infinite; }
    .char.up.a-sohei svg     { animation: chant 0.12s linear infinite; }
    .char.up.a-ranmaru svg   { animation: boing 0.7s ease-in-out infinite; }
    .char.up.a-nobunaga svg  { animation: proud 1.4s ease-in-out infinite; }

    .char .p-wing    { transform-origin: center; animation: flap 0.45s ease-in-out infinite; }
    .char .p-maedate { transform-origin: center; animation: gleam 0.7s ease-in-out infinite; }
    .char .p-ei      { transform-origin: 0% 0%; animation: tail 1.2s ease-in-out infinite; }
    .char .p-cross   { transform-origin: center; animation: glow 1.2s ease-in-out infinite; }
    .char .p-mage    { transform-origin: 0% 100%; animation: tail 1.4s ease-in-out infinite; }
    .char .p-blush   { transform-origin: center; animation: blushing 0.7s ease-in-out infinite; }

    /* 叩かれた瞬間：つぶれて目を回す */
    .char.hit svg { animation: squash 0.25s ease-out forwards; }

    @keyframes blink   { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes rage    { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-2%); } }
    @keyframes hop     { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9%) rotate(3deg); } }
    @keyframes sway    { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    @keyframes peek    { 0%, 100% { transform: translateX(-10%); } 40%, 60% { transform: translateX(10%); } }
    @keyframes hohoho  { 0%, 100% { transform: rotate(0) translateY(0); } 25% { transform: rotate(-5deg) translateY(-3%); } 75% { transform: rotate(5deg) translateY(-3%); } }
    @keyframes pray    { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.94) translateY(3%); } }
    @keyframes chant   { 0% { transform: translateX(-1.5%); } 50% { transform: translateX(1.5%); } 100% { transform: translateX(-1.5%); } }
    @keyframes boing   { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(1.06, 0.94); } 60% { transform: scale(0.96, 1.05) translateY(-4%); } }
    @keyframes proud   { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #fff); } 50% { transform: scale(1.05); filter: drop-shadow(0 0 10px #fff); } }
    @keyframes flap    { 0%, 100% { transform: scaleY(1) rotate(0); } 50% { transform: scaleY(0.6) rotate(-6deg); } }
    @keyframes gleam   { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.6) drop-shadow(0 0 3px #ffd970); } }
    @keyframes tail    { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(14deg); } }
    @keyframes glow    { 0%, 100% { filter: none; } 50% { filter: drop-shadow(0 0 4px #ffe9a0) brightness(1.4); } }
    @keyframes blushing{ 0%, 100% { transform: scale(1); } 50% { transform: scale(1.4); } }
    @keyframes squash  { 0% { transform: scale(1.15, 0.7); } 100% { transform: scale(0.9, 1.1) rotate(-20deg); } }

    @media (prefers-reduced-motion: reduce) {
      .char svg, .char svg * { animation: none !important; }
    }

    @keyframes pop {
      from { opacity: 1; transform: translate(-50%, 0); }
      to   { opacity: 0; transform: translate(-50%, -40px); }
    }

    .legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin: 14px auto 0;
      font-size: 13px;
      max-width: 480px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 6px;
    }

    .legend span b { color: var(--gold); }
    .legend .ng b { color: #ff8a80; }

    button {
      margin: 18px 0 28px;
      font-family: inherit;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 0.1em;
      padding: 12px 32px;
      color: #fff;
      background: linear-gradient(var(--blood), #6d1410);
      border: 2px solid var(--gold);
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; cursor: default; }

    /* 結果画面 */
    #result {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.75);
      z-index: 10;
    }

    #result.show { display: flex; }

    .scroll {
      width: 100%;
      max-width: 380px;
      padding: 24px 20px;
      color: #2b1a10;
      background: var(--paper);
      border-top: 14px solid var(--wood-dark);
      border-bottom: 14px solid var(--wood-dark);
      border-radius: 4px;
    }

    .scroll h2 { margin: 0 0 8px; font-size: 28px; color: var(--blood); }
    .scroll .final { font-size: 40px; font-weight: bold; margin: 6px 0; }
    .scroll .quote { font-size: 15px; line-height: 1.7; margin: 10px 0 0; }
    .scroll .stats { font-size: 13px; margin-top: 10px; opacity: 0.8; }
    .scroll button { margin: 18px 0 0; }

    body.shake #temple { animation: shake 0.25s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>

        { min: 0,  title: "是非に及ばず", quote: "本能寺は炎に包まれた。人間五十年、下天の内をくらぶれば……" }
      ],
      lordRank: { title: "主君討ち", quote: "白い浴衣の御屋形様を討ってしまった……。これでは明智勢と変わらぬ。" },
      stats: (list, ranmaru, maxCombo) =>
        `${list.join("・")} ／ 蘭丸を誤って ${ranmaru} ／ 最大連撃 ${maxCombo}`
    },
    en: {
      title: "Honnō-ji Whack-a-Mole",
      subtitle: "June 21, 1582 — “The enemy is at Honnō-ji!”<br>Whack Mitsuhide and the masterminds! But never touch your lord in the white robe.",
      score: "Merit", time: "Time", combo: "Combo", fire: "Honnō-ji is burning",
      legend: '<span>Akechi Mitsuhide <b>+5</b></span>' +
              '<span>Mastermind suspects (Hideyoshi, Ieyasu, Yoshiaki, court noble, Jesuit, Hiei monk) <b>+2</b></span>' +
              '<span class="ng">Mori Ranmaru (ally) <b>−3</b></span>' +
              '<span class="ng">Nobunaga in white robe <b>Instant game over</b></span>',
      start: "Charge!", fighting: "In battle…", retry: "Back to Honnō-ji",
      bgmOn: "♪ Music On", bgmOff: "♪ Music Off", langBtn: "日本語",
      popLord: "My lord?!", popRanmaru: "Ranmaru?!",
      chars: {
        hideyoshi:  { name: "Hideyoshi",  label: "Hideyoshi",  cry: "Hideyoshi did it!" },
        ieyasu:     { name: "Ieyasu",     label: "Ieyasu",     cry: "Ieyasu did it!" },
        yoshiaki:   { name: "Yoshiaki",   label: "Yoshiaki",   cry: "The Shogun did it!" },
        kuge:       { name: "Noble",      label: "Noble",      cry: "The Court did it!" },
        missionary: { name: "Jesuit",     label: "Jesuit",     cry: "The Jesuits did it!" },
        sohei:      { name: "Monk",       label: "Monk",       cry: "Mt. Hiei did it!" },
        mitsuhide:  { name: "Mitsuhide",  label: "Mitsuhide",  cry: "Got him!" },
        ranmaru:    { name: "Ranmaru",    label: "Ally" },
        nobunaga:   { name: "Nobunaga",   label: "Nobunaga" }
      },
      ranks: [
        { min: 90, title: "Master of the Realm", quote: "You repelled Mitsuhide and every mastermind. Nobunaga lives — history is rewritten!" },
        { min: 60, title: "Escaped Honnō-ji", quote: "You cut through the flames and barely made it back to Azuchi." },
        { min: 30, title: "Valiant to the End", quote: "“It cannot be helped…” Yet you fought on to the very last." },
        { min: 0,  title: "It Cannot Be Helped", quote: "Honnō-ji is engulfed in flames. “Fifty years of human life, compared with the heavens, are but a dream…”" }
      ],
      lordRank: { title: "Lord Slayer", quote: "You struck down your own lord in his white robe… You are no better than the Akechi." },
      stats: (list, ranmaru, maxCombo) =>
        `${list.join(", ")} / Ranmaru hit by mistake: ${ranmaru} / Max combo: ${maxCombo}`
    }
  };

  function load(key, fallback) {
    try { return localStorage.getItem("honnoji-" + key) ?? fallback; } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem("honnoji-" + key, value); } catch (e) { /* 保存できなくても動作する */ }
  }

  let lang = load("lang", (navigator.language || "ja").toLowerCase().startsWith("ja") ? "ja" : "en");
  if (!I18N[lang]) lang = "ja";
  const t = key => I18N[lang][key];

  // ---- BGM（Web Audio で合成：太鼓・篠笛・鉦） ----
  const BGM = (() => {
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx = null, master, wet, noise, timer = null;
    let step = 0, nextTime = 0, playing = false;
    let enabled = load("bgm", "1") === "1";

    // 都節音階（D・E♭・G・A・B♭）の旋律。数値は MIDI ノート、"-" は伸ばし、null は休符
    const _ = "-";
    const MELODY = [
      74, _, 75, 74,  70, _, 69, _,   70, 69, 67, _,  69, _, _, null,
      67, _, 69, 70,  74, _, 75, _,   79, _, 75, 74,  70, _, _, null,
      74, 75, 74, 70, 69, _, 70, 69,  67, _, 63, _,   62, _, _, null,
      62, _, 63, 67,  69, _, 70, _,   69, 67, 63, _,  62, _, _, null
    ];
    const DON = [0, 3, 4, 8, 11, 12, 14];
    const KA = [2, 6, 10];

    function init() {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0;
      master.connect(ctx.destination);

      // 簡易リバーブ（お堂の響き）
      const len = ctx.sampleRate * 1.8;
      const ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      }
      const conv = ctx.createConvolver();
      conv.buffer = ir;
      wet = ctx.createGain();
      wet.gain.value = 0.35;
      wet.connect(conv).connect(master);

      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const nd = noise.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    }

    function out(node, reverb = 0.5) {
      node.connect(master);
      if (reverb) {
        const g = ctx.createGain();
        g.gain.value = reverb;
        node.connect(g).connect(wet);
      }
    }

    function noiseBurst(time, type, freq, q, gain, decay) {
      const src = ctx.createBufferSource();
      src.buffer = noise;
      const f = ctx.createBiquadFilter();
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + decay);
      src.connect(f).connect(g);
      out(g, 0.3);
      src.start(time);
      src.stop(time + decay + 0.05);
    }

    function taiko(time, vel) {
      const o = ctx.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(130, time);
      o.frequency.exponentialRampToValueAtTime(48, time + 0.3);
      const g = ctx.createGain();
      g.gain.setValueAtTime(vel, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.6);
      o.connect(g);
      out(g, 0.4);
      o.start(time);
      o.stop(time + 0.65);
      noiseBurst(time, "lowpass", 380, 0.7, vel * 0.5, 0.09);
    }

    function ka(time) { noiseBurst(time, "bandpass", 3200, 2.5, 0.35, 0.04); }

    function kane(time) {
      [1, 2.76, 5.4].forEach((ratio, i) => {
        const o = ctx.createOscillator();
        o.frequency.value = 1350 * ratio;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.05 / (i + 1), time);
        g.gain.exponentialRampToValueAtTime(0.0005, time + 0.28);
        o.connect(g);
        out(g, 0.6);
        o.start(time);
        o.stop(time + 0.3);
      });
    }

    function fue(midi, time, dur) {
      const f = 440 * Math.pow(2, (midi - 69) / 12);
      const env = ctx.createGain();
      env.gain.setValueAtTime(0, time);
      env.gain.linearRampToValueAtTime(0.13, time + 0.04);
      env.gain.setValueAtTime(0.13, time + dur * 0.8);
      env.gain.linearRampToValueAtTime(0, time + dur * 0.98);
      out(env, 0.9);

      const lfo = ctx.createOscillator();
      lfo.frequency.value = 5.5;
      [["sine", 1, 1], ["triangle", 2, 0.12]].forEach(([type, mul, level]) => {
        const o = ctx.createOscillator();
        o.type = type;
        // 「しゃくり」：少し下から音程に入る
        o.frequency.setValueAtTime(f * mul * 0.965, time);
        o.frequency.linearRampToValueAtTime(f * mul, time + 0.07);
        const depth = ctx.createGain();
        depth.gain.setValueAtTime(0, time);
        depth.gain.linearRampToValueAtTime(f * mul * 0.012, time + Math.min(dur, 0.4));
        lfo.connect(depth).connect(o.frequency);
        const lv = ctx.createGain();
        lv.gain.value = level;
        o.connect(lv).connect(env);
        o.start(time);
        o.stop(time + dur + 0.05);
      });
      lfo.start(time);
      lfo.stop(time + dur + 0.05);

      // 息の音
      const src = ctx.createBufferSource();
      src.buffer = noise;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = 6;
      const bg = ctx.createGain();
      bg.gain.value = 0.25;
      src.connect(bp).connect(bg).connect(env);
      src.start(time);
      src.stop(time + dur + 0.05);
    }

    function playStep(i, time, beat) {
      const s16 = i % 16;
      const p = progress();
      if (DON.includes(s16)) taiko(time, s16 === 0 ? 0.9 : 0.6);
      else if (p > 0.6 && s16 % 2 === 0) taiko(time, 0.4);
      if (KA.includes(s16)) ka(time);
      if (p > 0.3 && s16 % 4 === 1) kane(time);

      const note = MELODY[i];
      if (typeof note === "number") {
        let len = 1;
        while (MELODY[(i + len) % MELODY.length] === _) len++;
        fue(note, time, len * beat);
      }
    }

    function scheduler() {
      while (nextTime < ctx.currentTime + 0.15) {
        const beat = 60 / (100 + progress() * 60) / 2; // 8分音符の長さ（炎上が進むほど速く）
        playStep(step, nextTime, beat);
        nextTime += beat;
        step = (step + 1) % MELODY.length;
      }
    }

    return {
      get enabled() { return enabled; },
      start() {
        if (!enabled || !AC || playing) return;
        if (!ctx) init();
        if (ctx.state === "suspended") ctx.resume();
        playing = true;
        step = 0;
        nextTime = ctx.currentTime + 0.08;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(0.55, ctx.currentTime);
        timer = setInterval(scheduler, 25);
        scheduler();
      },
      stop() {
        if (!playing) return;
        playing = false;
        clearInterval(timer);
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setTargetAtTime(0, ctx.currentTime, 0.25);
      },
      toggle() {
        enabled = !enabled;
        save("bgm", enabled ? "1" : "0");
        if (!enabled) this.stop();
        else if (running) this.start();
      }
    };
  })();

  // ---- 設定 ----
  const GAME_SECONDS = 30;
  const HOLE_COUNT = 9;

  // ---- 要素 ----
  const $ = id => document.getElementById(id);
  const gameEl = $("game");
  const scoreEl = $("score");
  const timeEl = $("time");
  const comboEl = $("combo");
  const fireBarEl = document.querySelector("#fireBar div");
  const startBtn = $("startBtn");
  const resultEl = $("result");
  const sounds = {
    hit: $("hitSound"), miss: $("missSound"), start: $("startSound"), end: $("endSound")
  };

  function play(name) {
    const a = sounds[name];
    try {
      a.currentTime = 0;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) { /* 音声が再生できない環境では無視 */ }
  }

  // ---- 状態 ----
  let running = false;
  let score = 0, combo = 0, maxCombo = 0;
  let kills = Object.fromEntries(Object.keys(CHARACTERS).map(k => [k, 0]));
  let timeLeft = GAME_SECONDS;
  let spawnTimer = null, clockTimer = null;
  const holes = [];

  // ---- 穴を作成 ----
  for (let i = 0; i < HOLE_COUNT; i++) {
    const el = document.createElement("div");
    el.className = "hole";
    const hole = { el, type: null, charEl: null, hideTimer: null };
    el.addEventListener("pointerdown", e => { e.preventDefault(); whack(hole); });
    gameEl.appendChild(el);
    holes.push(hole);
  }

  function pickType() {
    const entries = Object.entries(CHARACTERS);
    const total = entries.reduce((s, [, c]) => s + c.weight, 0);
    let r = Math.random() * total;
    for (const [key, c] of entries) {
      if ((r -= c.weight) < 0) return key;
    }
    return "mitsuhide";
  }

  // 経過時間に応じて難しくする（0 → 1）
  function progress() {
    return 1 - timeLeft / GAME_SECONDS;
  }

  function spawn() {
    if (!running) return;
    const empty = holes.filter(h => !h.type);
    const maxUp = progress() < 0.4 ? 1 : progress() < 0.75 ? 2 : 3;
    if (empty.length && HOLE_COUNT - empty.length < maxUp) {
      const hole = empty[Math.floor(Math.random() * empty.length)];
      const type = pickType();
      const charEl = document.createElement("div");
      charEl.className = "char a-" + type;
      charEl.innerHTML = CHARACTERS[type].svg.replace("{{label}}", t("chars")[type].label);
      hole.el.appendChild(charEl);
      hole.type = type;
      hole.charEl = charEl;
      requestAnimationFrame(() => requestAnimationFrame(() => charEl.classList.add("up")));

      const stay = 1100 - progress() * 500 + (type === "mitsuhide" ? -150 : 0);
      hole.hideTimer = setTimeout(() => {
        // 叩くべき相手を逃したら連撃は途切れる
        if (hole.type && CHARACTERS[hole.type].points > 0) resetCombo();
        clearHole(hole, false);
      }, stay);
    }
    const next = 650 - progress() * 300 + Math.random() * 250;
    spawnTimer = setTimeout(spawn, next);
  }

  function clearHole(hole, wasHit) {
    clearTimeout(hole.hideTimer);
    const charEl = hole.charEl;
    hole.type = null;
    hole.charEl = null;
    if (!charEl) return;
    charEl.classList.remove("up");
    if (wasHit) charEl.classList.add("hit");
    setTimeout(() => charEl.remove(), 260);
  }

  function whack(hole) {
    if (!running) return;
    if (!hole.type) {
      resetCombo();
      play("miss");
      return;
    }
    const type = hole.type;
    const c = CHARACTERS[type];
    kills[type]++;

    if (c.gameOver) {
      showPop(hole, t("popLord"), "minus");
      play("miss");
      document.body.classList.remove("shake");
      void document.body.offsetWidth;
      document.body.classList.add("shake");
      clearHole(hole, true);
      endGame(true);
      return;
    }

    if (c.points > 0) {
      combo++;
      maxCombo = Math.max(maxCombo, combo);
      const bonus = combo >= 10 ? 2 : combo >= 5 ? 1 : 0;
      const gained = c.points + bonus;
      score += gained;
      const cry = t("chars")[type].cry;
      showPop(hole, `+${gained}${cry ? " " + cry : ""}`, "plus");
      play("hit");
    } else {
      score = Math.max(0, score + c.points);
      resetCombo();
      showPop(hole, `${c.points} ${t("popRanmaru")}`, "minus");
      play("miss");
      document.body.classList.remove("shake");
      void document.body.offsetWidth;
      document.body.classList.add("shake");
    }
    clearHole(hole, true);
    updateHud();
  }

  function showPop(hole, text, cls) {
    const pop = document.createElement("div");
    pop.className = "pop " + cls;
    pop.textContent = text;
    hole.el.appendChild(pop);
    setTimeout(() => pop.remove(), 700);
  }

  function resetCombo() {
    combo = 0;
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    comboEl.textContent = combo;
    timeEl.textContent = timeLeft;
    const p = progress();
    fireBarEl.style.width = (p * 100) + "%";
    document.body.style.setProperty("--fire-level", (0.15 + p * 0.7).toFixed(2));
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0; combo = 0; maxCombo = 0;
    kills = Object.fromEntries(Object.keys(CHARACTERS).map(k => [k, 0]));
    timeLeft = GAME_SECONDS;
    holes.forEach(h => clearHole(h, false));
    resultEl.classList.remove("show");
    startBtn.disabled = true;
    startBtn.textContent = t("fighting");
    updateHud();
    play("start");
    BGM.start();

    spawnTimer = setTimeout(spawn, 500);
    clockTimer = setInterval(() => {
      timeLeft--;
      updateHud();
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  let lastResult = null;

  function endGame(struckLord = false) {
    running = false;
    clearTimeout(spawnTimer);
    clearInterval(clockTimer);
    holes.forEach(h => clearHole(h, false));
    BGM.stop();
    play("end");

    lastResult = { struckLord, score, kills: { ...kills }, maxCombo };
    renderResult();
    resultEl.classList.add("show");
    startBtn.disabled = false;
    startBtn.textContent = t("start");
  }

  function renderResult() {
    if (!lastResult) return;
    const r = lastResult;
    const rank = r.struckLord ? t("lordRank") : t("ranks").find(x => r.score >= x.min);
    $("rankTitle").textContent = rank.title;
    $("finalScore").textContent = r.score;
    $("rankQuote").textContent = rank.quote;
    const names = t("chars");
    const list = Object.entries(CHARACTERS).filter(([, c]) => c.points > 0)
      .map(([k]) => `${names[k].name} ${r.kills[k]}`);
    $("stats").textContent = t("stats")(list, r.kills.ranmaru, r.maxCombo);
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    $("fireBar").title = t("fire");
    startBtn.textContent = running ? t("fighting") : t("start");
    $("langBtn").textContent = t("langBtn");
    updateBgmBtn();
    // 出ているキャラクターの名札も差し替える
    holes.forEach(h => {
      const label = h.charEl && h.charEl.querySelector("text");
      if (label) label.textContent = t("chars")[h.type].label;
    });
    renderResult();
  }

  function updateBgmBtn() {
    const btn = $("bgmBtn");
    btn.textContent = BGM.enabled ? t("bgmOn") : t("bgmOff");
    btn.setAttribute("aria-pressed", String(BGM.enabled));
  }

  // 舞い上がる火の粉
  (function makeEmbers() {
    const box = $("embers");
    for (let i = 0; i < 26; i++) {
      const e = document.createElement("span");
      e.style.left = (Math.random() * 100) + "%";
      e.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
      e.style.animationDuration = (4 + Math.random() * 5) + "s";
      e.style.animationDelay = (-Math.random() * 9) + "s";
      const size = 2 + Math.random() * 4;
      e.style.width = e.style.height = size + "px";
      box.appendChild(e);
    }
  })();

  $("bgmBtn").addEventListener("click", () => { BGM.toggle(); updateBgmBtn(); });
  $("langBtn").addEventListener("click", () => {
    lang = lang === "ja" ? "en" : "ja";
    save("lang", lang);
    applyLang();
  });
  startBtn.addEventListener("click", startGame);
  $("retryBtn").addEventListener("click", startGame);
  applyLang();
  updateHud();
</script>

</body>
</html>
